<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JupyterLite + AI Data Visualization Demo</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;color:#172133}body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px;background:#0b2740;color:#fff;border-bottom:1px solid #24445f}header strong{font-size:15px}header small{opacity:.8}.toplinks{display:flex;gap:10px}.toplinks a{color:#fff;text-decoration:none;border:1px solid #54748d;border-radius:8px;padding:6px 9px;font-size:13px}main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,.75fr);min-height:0}.lab{min-width:0;min-height:0;background:#fff}.lab iframe{border:0;width:100%;height:100%;display:block}aside{min-width:0;display:grid;grid-template-rows:auto auto 1fr auto;background:#fff;border-left:1px solid #d9e1e8;min-height:0}.panel{padding:12px 14px;border-bottom:1px solid #e2e8ef}label{font-size:12px;font-weight:800;color:#4f6173;text-transform:uppercase;letter-spacing:.045em;display:block;margin-bottom:6px}select,input,textarea,button{font:inherit}select,input,textarea{width:100%;border:1px solid #bbc8d4;border-radius:8px;padding:9px;background:#fff;color:#172133}textarea{resize:vertical;min-height:68px}.mode-help{font-size:12px;line-height:1.45;color:#607286;margin-top:7px}.gateway{display:none;margin-top:10px}.gateway.visible{display:block}#chat{padding:14px;overflow:auto;min-height:0;background:#f7f9fb;display:flex;flex-direction:column;gap:10px}.msg{padding:10px 12px;border-radius:12px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;max-width:94%;box-shadow:0 1px 2px rgba(0,0,0,.04)}.assistant{align-self:flex-start;background:#fff;border:1px solid #dde5ec}.user{align-self:flex-end;background:#dfeefa;border:1px solid #c6deef}.status{font-size:12px;color:#5c6e80;margin-top:7px}.progress{height:5px;border-radius:5px;background:#e6edf3;overflow:hidden;margin-top:7px}.bar{height:100%;width:0;background:#2278b8;transition:width .25s}.composer{padding:12px 14px;border-top:1px solid #dfe6ed;background:#fff}.buttons{display:flex;gap:8px;margin-top:8px}.buttons button{border:0;border-radius:8px;padding:9px 12px;font-weight:750;cursor:pointer}.send{background:#1261a0;color:#fff;flex:1}.secondary{background:#edf2f6;color:#263a4c}.buttons button:disabled{opacity:.45;cursor:not-allowed}.context{margin-top:10px}.context textarea{min-height:54px;font-size:12px}@media(max-width:900px){body{overflow:auto;display:block}header{position:sticky;top:0;z-index:5}main{display:block}.lab{height:62vh}aside{border-left:0;border-top:1px solid #d9e1e8;height:75vh}}
</style>
</head>
<body>
<header><div><strong>JupyterLite + AI Visualization Lab</strong> <small>static GitHub Pages demo</small></div><div class="toplinks"><a href="../lab/index.html" target="_blank" rel="noopener">Lab in new tab</a></div></header>
<main>
<section class="lab" aria-label="JupyterLite Lab"><iframe src="../lab/index.html" title="JupyterLite Lab"></iframe></section>
<aside aria-label="AI assistant">
<section class="panel"><label for="mode">AI mode</label><select id="mode"><option value="local">Local Browser AI (WebLLM / WebGPU)</option><option value="gateway">HHS/CDC approved gateway</option><option value="handoff">HHS ChatGPT handoff</option></select><div id="modeHelp" class="mode-help"></div><div id="gatewayBox" class="gateway"><label for="gatewayUrl">Approved gateway URL</label><input id="gatewayUrl" type="url" placeholder="https://approved-hhs-host.example.gov/chat" autocomplete="off"></div><div class="progress"><div id="bar" class="bar"></div></div><div id="status" class="status">Ready.</div></section>
<section class="panel context"><label for="context">Notebook / chart context (optional)</label><textarea id="context" placeholder="Paste a dataframe summary, code cell, chart description, or result here. No automatic notebook scraping occurs."></textarea></section>
<section id="chat" aria-live="polite"></section>
<section class="composer"><textarea id="prompt" placeholder="Ask about a visualization method, code, chart interpretation, or what to try next..."></textarea><div class="buttons"><button id="clear" class="secondary" type="button">Clear</button><button id="send" class="send" type="button">Send</button></div></section>
</aside></main>
<script type="module">
const $=id=>document.getElementById(id),mode=$('mode'),help=$('modeHelp'),gatewayBox=$('gatewayBox'),status=$('status'),bar=$('bar'),chat=$('chat'),prompt=$('prompt'),context=$('context'),send=$('send'),clear=$('clear'),gatewayUrl=$('gatewayUrl');
let webllm=null,engine=null,localModel=null;let messages=[{role:'system',content:'You are a concise data-visualization assistant. Help users reason about chart choice, Python/Pandas/Matplotlib/NetworkX code, uncertainty, accessibility, and interpretation. Never claim to see a notebook or chart unless the user pasted its content or description.'}];
function add(role,text){const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'assistant');d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function setStatus(text,pct=null){status.textContent=text;if(pct!==null)bar.style.width=Math.max(0,Math.min(100,pct))+'%'}
function refreshMode(){const m=mode.value;gatewayBox.classList.toggle('visible',m==='gateway');if(m==='local')help.textContent='Runs a small language model locally in this browser. Requires WebGPU; the first model download can be large and is normally cached by the browser.';if(m==='gateway')help.textContent='For an HHS/CDC-managed HTTPS endpoint only. Uses the browser authenticated session (credentials: include); this page never asks for or stores an API key.';if(m==='handoff')help.textContent='Copies your question/context and opens ChatGPT in a new tab. Sign in and select your authorized HHS workspace there; this page does not impersonate HHS SSO.';setStatus('Ready.',0)}mode.addEventListener('change',refreshMode);refreshMode();add('assistant','Choose an AI mode, explore the notebook on the left, and ask about a visualization. For chart-specific help, paste a short description, dataframe summary, or relevant code into the context box.');
function composed(q){const c=context.value.trim();return c?`Notebook/chart context:\n${c}\n\nQuestion:\n${q}`:q}
async function ensureLocal(){if(engine)return engine;if(!('gpu' in navigator))throw new Error('WebGPU is unavailable in this browser. Try a current WebGPU-capable browser or use HHS ChatGPT handoff.');setStatus('Loading WebLLM runtime…',4);webllm=await import('https://esm.run/@mlc-ai/web-llm@0.2.84');const ids=(webllm.prebuiltAppConfig?.model_list||[]).map(x=>x.model_id);localModel=ids.find(x=>/Qwen2[-.]?0\.5B-Instruct.*q4f/i.test(x))||ids.find(x=>/Qwen2.*0\.5B.*Instruct/i.test(x))||ids.find(x=>/SmolLM.*360M.*Instruct/i.test(x))||ids.find(x=>/0\.5B.*Instruct/i.test(x))||ids.find(x=>/1B.*Instruct/i.test(x));if(!localModel)throw new Error('No suitable small prebuilt WebLLM model was found.');setStatus(`Downloading/loading ${localModel}…`,8);engine=await webllm.CreateMLCEngine(localModel,{initProgressCallback:p=>{const f=Number.isFinite(p.progress)?p.progress:0;setStatus(p.text||`Loading ${localModel}…`,Math.max(8,Math.round(f*100)))}});setStatus(`Local AI ready: ${localModel}`,100);return engine}
async function askLocal(t){const e=await ensureLocal();messages.push({role:'user',content:t});setStatus(`Thinking locally with ${localModel}…`,100);const r=await e.chat.completions.create({messages,temperature:.35,max_tokens:650});const x=r?.choices?.[0]?.message?.content||'No response returned.';messages.push({role:'assistant',content:x});return x}
async function askGateway(t){const url=gatewayUrl.value.trim();if(!url)throw new Error('Enter the URL of an HHS/CDC-approved gateway.');if(!/^https:\/\//i.test(url))throw new Error('The gateway must use HTTPS.');messages.push({role:'user',content:t});setStatus('Calling approved gateway…',30);const r=await fetch(url,{method:'POST',mode:'cors',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,source:'jupyterlite-data-visualization-demo'})});if(!r.ok)throw new Error(`Gateway returned HTTP ${r.status}.`);const data=await r.json(),x=data?.message?.content??data?.output_text??data?.response;if(typeof x!=='string')throw new Error('Gateway response must contain message.content, output_text, or response.');messages.push({role:'assistant',content:x});setStatus('Gateway response received.',100);return x}
async function handoff(t){const packet=`JupyterLite Data Visualization demo\n\n${t}\n\nPlease help me analyze or improve this visualization work. State any assumptions you make.`;try{await navigator.clipboard.writeText(packet);setStatus('Copied context/question. Opening ChatGPT…',100)}catch{setStatus('Opening ChatGPT. Copy your question manually if clipboard permission was blocked.',100)}window.open('https://chatgpt.com/','_blank','noopener,noreferrer');return 'I opened ChatGPT in a new tab and attempted to copy your notebook/chart context plus question. Sign in and select your authorized HHS workspace, then paste it there. No HHS credentials were handled by this page.'}
async function submit(){const q=prompt.value.trim();if(!q)return;const t=composed(q);add('user',q);prompt.value='';send.disabled=true;try{let x;if(mode.value==='local')x=await askLocal(t);else if(mode.value==='gateway')x=await askGateway(t);else x=await handoff(t);add('assistant',x)}catch(e){add('assistant',`Error: ${e?.message||e}`);setStatus('Request failed.',0)}finally{send.disabled=false;prompt.focus()}}send.addEventListener('click',submit);prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();submit()}});clear.addEventListener('click',()=>{chat.textContent='';messages=messages.slice(0,1);add('assistant','Chat cleared. Notebook state on the left is unchanged.');setStatus('Ready.',0)});
</script>
</body></html>
